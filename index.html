     <body>
<div class="container">
        <h2>Let's get you started</h2>
        <p class="subtitle">Enter the details to get going</p>

        <div class="steps-indicator">
            <div class="step">
                <span class="circle">1</span>
                <span class="label">General Details</span>
            </div>
            <div class="step">
                <span class="circle">2</span>
                <span class="label">Account Setup</span>
            </div>
            <div class="step">
                <span class="circle">3</span>
                <span class="label">Preview</span>
            </div>
        </div>

        <form>
            <div class="form-page">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name *</label>
                        <input type="text" placeholder="Enter your First Name">
                    </div>
                    <div class="form-group">
                        <label>Last Name *</label>
                        <input type="text" placeholder="Enter your Last Name">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Gender *</label>
                        <select>
                            <option value="">Select</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth *</label>
                        <input type="timedate" placeholder="YYYY-MM-DD">
                    </div>
                </div>

            <div class="form-page">
                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address *</label>
                        <input type="email" placeholder="Enter your Email">
                    </div>
                    <div class="form-group">
                        <label>Mobile Number *</label>
                        <input type="tel" placeholder="Enter Mobile">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Pin Code *</label>
                        <input type="password" placeholder="Enter your pin Code">
                    </div>
                    <div class="form-group">
                        <label>Country *</label>
                        <select>
                            <option value="">Select</option>
                            <option value="ps">Palestine</option>
                            <option value="jo">Jordan</option>
                            <option value="eg">Egypt</option>
                        </select>
                    </div>
                </div>

<div class="form-page last-page">
                <div class="preview-section">
                    <h3>Preview Your Details</h3>
                    <p class="preview-sub">Please review your information before submitting</p>
                </div>

                <div class="btn-container space-between">
                    <button type="button" class="btn-back">Back</button>
                    <button type="submit" class="btn-submit">Submit</button>
                </div>
            </div>
        </form>
    </div>

</body>
